name: CI

on:
  push:
    branches: [main, feat/extension-mvp]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension JavaScript and test recommender
        run: npm run check
      - name: Probe five known Shorts thumbnails (diagnostic, temporary)
        run: node scripts/diagnose-shorts.mjs EZy9KqeQKrA HlhOrCrn7vk zzITiIxxD8c -prSdejMkaI uo5VU-KtUZk
